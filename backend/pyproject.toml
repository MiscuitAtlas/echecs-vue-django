[project]
name = "echecs-vue-django"
version = "2.0.0"
description = "Jeu d'échecs en ligne : serveur Django, règles et temps réel."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF"]
ignore = ["S101", "S105", "S106", "RUF001", "RUF002", "RUF003", "RUF012"]
